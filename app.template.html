<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garda Ferries">
<meta name="theme-color" content="#0b3d5c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Garda Ferries</title>
<style>
:root {
  --bg: #f2f4f7;
  --card: #ffffff;
  --ink: #14181d;
  --muted: #6b7480;
  --line: #dfe3e9;
  --accent: #0b6ea8;
  --accent-soft: #e6f1f8;
  --sr: #b4520a;
  --sr-soft: #fdeee0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1216;
    --card: #171d23;
    --ink: #e8ecf1;
    --muted: #949daa;
    --line: #262e37;
    --accent: #4aa8dd;
    --accent-soft: #14293a;
    --sr: #e8a05e;
    --sr-soft: #33230f;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 40px; }

header { padding: 18px 2px 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

/* ---- search panel ---- */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  box-shadow: var(--shadow);
}
.row { display: flex; align-items: center; gap: 10px; }
.row + .row { margin-top: 10px; }
.field { flex: 1; min-width: 0; }
label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin: 0 0 4px 2px;
}
select, input[type=time] {
  width: 100%;
  font: inherit;
  font-size: 17px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 10px;
  min-height: 44px;
  appearance: none;
  -webkit-appearance: none;
}
input[type=time] { text-align: left; }
button {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 44px;
  padding: 0 14px;
  cursor: pointer;
}
button:active { background: var(--accent-soft); }
#swap {
  align-self: end;
  width: 44px;
  padding: 0;
  font-size: 17px;
  flex: none;
}
#now { flex: none; align-self: end; }

/* ---- results ---- */
.note {
  margin: 18px 2px 8px;
  color: var(--muted);
  font-size: 13px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  margin-top: 10px;
  box-shadow: var(--shadow);
}
.card.next { border-color: var(--accent); }
.times {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.t { font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
.arrow { color: var(--muted); font-size: 17px; }
.dur { margin-left: auto; color: var(--muted); font-size: 14px; }
.ends { color: var(--muted); font-size: 14px; margin-top: 1px; }
.meta {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}
.tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.tag.sr { background: var(--sr-soft); color: var(--sr); }
.tag.now { background: var(--accent); color: #fff; }
.via { flex-basis: 100%; }

/* legs of a connection with one change */
.leg { display: flex; gap: 10px; font-size: 14px; padding: 2px 0; }
.leg .lt { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.change {
  font-size: 13px;
  color: var(--sr);
  padding: 4px 0 4px 2px;
}
.legs { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

.empty { color: var(--muted); font-size: 14px; padding: 16px 2px; }
.more {
  width: 100%;
  margin-top: 10px;
  color: var(--accent);
  background: transparent;
  border-style: dashed;
}
footer { margin-top: 26px; color: var(--muted); font-size: 12px; padding: 0 2px; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Garda Ferries</h1>
  <p id="validity"></p>
</header>

<div class="panel">
  <div class="row">
    <div class="field">
      <label for="from">From</label>
      <select id="from"></select>
    </div>
    <button id="swap" type="button" title="Swap" aria-label="Swap from and to">⇄</button>
    <div class="field">
      <label for="to">To</label>
      <select id="to"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="time">Around</label>
      <input type="time" id="time">
    </div>
    <button id="now" type="button">Now</button>
  </div>
</div>

<div id="results"></div>

<footer>
  Times from the Navigazione Laghi summer 2026 timetable. Check
  <a href="https://www.navigazionelaghi.it">navigazionelaghi.it</a> before travelling —
  ships and times can change.
</footer>

</div>

<script>
const DATA = /*__DATA__*/;

const MIN_TRANSFER = 10;   // minutes needed to change boat
const MAX_WAIT = 180;      // ignore connections that leave you waiting longer
const BEFORE = 2;          // sailings shown before the chosen time
const AFTER = 4;           // sailings shown after it

const $ = (id) => document.getElementById(id);
const fromSel = $("from"), toSel = $("to"), timeInput = $("time"), results = $("results");

/* ---------- timetable lookups ---------- */

// Journeys on a single boat: A and B on the same sailing, A called first.
function findDirect(a, b) {
  const out = [];
  for (const sailing of DATA.sailings) {
    const i = sailing.s.findIndex((call) => call[0] === a);
    if (i < 0) continue;
    const j = sailing.s.findIndex((call, k) => k > i && call[0] === b);
    if (j < 0) continue;
    out.push({
      dep: sailing.s[i][1],
      arr: sailing.s[j][1],
      corsa: sailing.c,
      sr: sailing.sr,
      via: sailing.s.slice(i + 1, j).map((call) => DATA.stops[call[0]].n),
    });
  }
  return out.sort((x, y) => x.dep - y.dep || x.arr - y.arr);
}

// Journeys with exactly one change, at any stop both boats call at.
function findOneChange(a, b) {
  const found = [];
  for (const first of DATA.sailings) {
    const i = first.s.findIndex((call) => call[0] === a);
    if (i < 0) continue;
    for (let m = i + 1; m < first.s.length; m++) {
      const via = first.s[m][0];
      if (via === b) continue;              // that would be a direct journey
      const readyAt = first.s[m][1] + MIN_TRANSFER;
      for (const second of DATA.sailings) {
        if (second === first) continue;
        const j = second.s.findIndex((call) => call[0] === via && call[1] >= readyAt);
        if (j < 0) continue;
        if (second.s[j][1] - first.s[m][1] > MAX_WAIT) continue;
        const k = second.s.findIndex((call, n) => n > j && call[0] === b);
        if (k < 0) continue;
        found.push({
          dep: first.s[i][1],
          arr: second.s[k][1],
          via: DATA.stops[via].n,
          wait: second.s[j][1] - first.s[m][1],
          legs: [
            { dep: first.s[i][1], arr: first.s[m][1], corsa: first.c, sr: first.sr,
              from: a, to: via },
            { dep: second.s[j][1], arr: second.s[k][1], corsa: second.c, sr: second.sr,
              from: via, to: b },
          ],
        });
      }
    }
  }
  // Keep only the options that are not beaten outright: for a given departure,
  // a later start that still arrives sooner makes the earlier one pointless.
  found.sort((x, y) => y.dep - x.dep || x.arr - y.arr);
  const best = [];
  let bestArr = Infinity;
  for (const option of found) {
    if (option.arr < bestArr) { best.push(option); bestArr = option.arr; }
  }
  return best.reverse();
}

/* ---------- formatting ---------- */

const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

function duration(m) {
  const h = Math.floor(m / 60), rest = m % 60;
  return h ? (rest ? `${h}h ${rest}m` : `${h}h`) : `${rest}m`;
}

const escape = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---------- rendering ---------- */

// Pick the sailings around the chosen time: a couple before, a few after.
function slice(list, target) {
  const first = list.findIndex((x) => x.dep >= target);
  if (first < 0) return { shown: list.slice(-BEFORE - 1), nextIndex: -1 };
  const start = Math.max(0, first - BEFORE);
  return { shown: list.slice(start, first + AFTER), nextIndex: first - start };
}

function directCard(journey, isNext, fromName, toName) {
  const tags = [];
  if (isNext) tags.push('<span class="tag now">next</span>');
  if (journey.sr) tags.push('<span class="tag sr">SR supplement</span>');
  tags.push(`<span>corsa ${escape(journey.corsa)}</span>`);
  const via = journey.via.length
    ? `<span class="via">via ${journey.via.map(escape).join(" · ")}</span>`
    : `<span class="via">non-stop</span>`;
  return `<div class="card${isNext ? " next" : ""}">
    <div class="times">
      <span class="t">${hhmm(journey.dep)}</span>
      <span class="arrow">→</span>
      <span class="t">${hhmm(journey.arr)}</span>
      <span class="dur">${duration(journey.arr - journey.dep)}</span>
    </div>
    <div class="ends">${escape(fromName)} → ${escape(toName)}</div>
    <div class="meta">${tags.join("")}${via}</div>
  </div>`;
}

function changeCard(journey, isNext) {
  const leg = (l) => `<div class="leg">
      <span class="lt">${hhmm(l.dep)} → ${hhmm(l.arr)}</span>
      <span>${escape(DATA.stops[l.from].n)} → ${escape(DATA.stops[l.to].n)}
        <span style="color:var(--muted)">· corsa ${escape(l.corsa)}${l.sr ? " · SR" : ""}</span></span>
    </div>`;
  return `<div class="card${isNext ? " next" : ""}">
    <div class="times">
      <span class="t">${hhmm(journey.dep)}</span>
      <span class="arrow">→</span>
      <span class="t">${hhmm(journey.arr)}</span>
      <span class="dur">${duration(journey.arr - journey.dep)}</span>
    </div>
    <div class="ends">${isNext ? '<span class="tag now">next</span> ' : ""}1 change at ${escape(journey.via)}</div>
    <div class="legs">
      ${leg(journey.legs[0])}
      <div class="change">↳ ${duration(journey.wait)} wait at ${escape(journey.via)}</div>
      ${leg(journey.legs[1])}
    </div>
  </div>`;
}

let showChanges = false;

function render() {
  const a = Number(fromSel.value), b = Number(toSel.value);
  localStorage.setItem("garda", JSON.stringify({ a, b }));

  if (a === b) {
    results.innerHTML = `<p class="empty">Pick two different stops.</p>`;
    return;
  }

  const [h, m] = (timeInput.value || "00:00").split(":");
  const target = Number(h) * 60 + Number(m);
  const fromName = DATA.stops[a].n, toName = DATA.stops[b].n;

  const direct = findDirect(a, b);
  let html = "";

  if (direct.length) {
    const { shown, nextIndex } = slice(direct, target);
    html += `<p class="note">${direct.length} direct sailing${direct.length > 1 ? "s" : ""} a day${
      nextIndex < 0 ? " — none left after this time, showing the last ones" : ""}</p>`;
    html += shown.map((j, i) => directCard(j, i === nextIndex, fromName, toName)).join("");
    html += `<button class="more" type="button" id="toggle">${
      showChanges ? "Hide routes with a change" : "Also show routes with a change"}</button>`;
  }

  if (!direct.length || showChanges) {
    const changes = findOneChange(a, b);
    if (!changes.length) {
      html += `<p class="empty">No route from ${escape(fromName)} to ${escape(toName)}${
        direct.length ? " with a change" : ""}, direct or with one change.</p>`;
    } else {
      const { shown, nextIndex } = slice(changes, target);
      html += `<p class="note">${direct.length ? "With one change" : "No direct sailing — with one change"}</p>`;
      html += shown.map((j, i) => changeCard(j, i === nextIndex && !direct.length)).join("");
    }
  }

  results.innerHTML = html;
  const toggle = $("toggle");
  if (toggle) toggle.onclick = () => { showChanges = !showChanges; render(); };
}

/* ---------- setup ---------- */

function fillSelect(select, selected) {
  let group = null, html = "";
  DATA.stops.forEach((stop, i) => {
    if (stop.g !== group) {
      if (group !== null) html += "</optgroup>";
      html += `<optgroup label="${stop.g}">`;
      group = stop.g;
    }
    html += `<option value="${i}"${i === selected ? " selected" : ""}>${escape(stop.n)}</option>`;
  });
  select.innerHTML = html + "</optgroup>";
}

function setNow() {
  const d = new Date();
  timeInput.value = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

$("validity").textContent = "Summer timetable · " + DATA.valid.replace(" to ", " – ");

const saved = JSON.parse(localStorage.getItem("garda") || "null") || {};
const defaultFrom = DATA.stops.findIndex((s) => s.n === "Desenzano");
const defaultTo = DATA.stops.findIndex((s) => s.n === "Riva del Garda");
fillSelect(fromSel, saved.a ?? defaultFrom);
fillSelect(toSel, saved.b ?? defaultTo);
setNow();

fromSel.onchange = toSel.onchange = timeInput.onchange = () => { showChanges = false; render(); };
$("now").onclick = () => { setNow(); showChanges = false; render(); };
$("swap").onclick = () => {
  const a = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = a;
  showChanges = false;
  render();
};
// Coming back to the app after a while should not show a stale "next" boat.
document.addEventListener("visibilitychange", () => { if (!document.hidden) { setNow(); render(); } });

render();
</script>
</body>
</html>
